<div class="flex items-center justify-between mb-2">
  <div class="w-60 flex-auto">
    <h3 class="section-title">{{ viewDate | calendarDate: view + 'ViewTitle' : 'en' }}</h3>
  </div>
  <div class="w-40 flex-auto text-right">
    <div
      class="btn btn-primary"
      mwlCalendarPreviousView
      [view]="view"
      [(viewDate)]="viewDate"
      (viewDateChange)="closeOpenMonthViewDay()"
    >
      <span class="icon-[heroicons--chevron-left]"></span>
    </div>

    <div
      class="btn btn-primary"
      mwlCalendarNextView
      [view]="view"
      [(viewDate)]="viewDate"
      (viewDateChange)="closeOpenMonthViewDay()"
    >
      <span class="icon-[heroicons--chevron-right]"></span>
    </div>
    <div class="btn btn-primary" mwlCalendarToday [(viewDate)]="viewDate">
      <span class="icon-[heroicons--arrow-path]"></span>
    </div>
  </div>
</div>

<div class="practice-calendar">
  <mwl-calendar-month-view
    class="practice-calendar"
    [viewDate]="viewDate"
    [events]="events()"
    [refresh]="refresh"
    (beforeViewRender)="beforeMonthViewRender($event)"
    (dayClicked)="dayClicked($event.day)"
  />
</div>
